<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#07060e" />
<title>WizRogue — a first-person spell-casting roguelike</title>
<link rel="stylesheet" href="styles.css" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" href="icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="icon.svg" />
</head>
<body>
  <div id="game">
    <canvas id="view" width="480" height="270"></canvas>

    <div id="hud" hidden>
      <div class="hud-top">
        <div class="chip" id="depth">DEPTH 1</div>
        <div class="chip ghost" id="objective"></div>
        <div class="chip" id="kills">0 slain</div>
      </div>

      <div id="bossbar" hidden>
        <div class="boss-name">Corridor Warden</div>
        <div class="track"><i></i></div>
      </div>

      <div id="log"></div>
      <div id="crosshair"><span></span><span></span><span></span><span></span></div>

      <div class="hud-bottom">
        <div id="vitals">
          <div class="meter hp"><i></i><label>VITALITY</label><b>100</b></div>
          <div class="meter mp"><i></i><em></em><label>MANA</label><b>100</b></div>
        </div>
        <div id="slots"></div>
      </div>

      <div id="touch" hidden>
        <div class="tzone move"></div>
        <div class="tzone look"></div>
        <div id="stick"><div class="stick-base"></div><div class="stick-nub"></div></div>
        <button id="castBtn" aria-label="Cast spell"><i class="ring"></i><span class="glyph">✦</span></button>
        <button id="pauseBtn" aria-label="Pause">❚❚</button>
      </div>
    </div>

    <div id="overlay"></div>
    <div id="fader"></div>
  </div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
