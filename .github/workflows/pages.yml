# Deploys the game to GitHub Pages so it can be played (and thumb-tested)
# straight from a phone. Requires Pages to be enabled for the repository with
# "GitHub Actions" as the source (Settings → Pages → Build and deployment).
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Pages allows one live deployment at a time. Queue them rather than cancelling:
# a cancelled deploy leaves the published site on the previous commit, and two
# deploys racing (feature branch + main) is what made this workflow need retries.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
