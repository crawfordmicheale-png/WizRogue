# Deploys the game to GitHub Pages so it can be played (and thumb-tested)
# straight from a phone. Requires Pages to be enabled for the repository with
# "GitHub Actions" as the source (Settings → Pages → Build and deployment).
name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/spell-casting-roguelike-eu0kh9, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
